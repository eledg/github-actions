name: CDK Synth
description: Configure AWS credentials and run CDK synth
inputs:
  role-to-assume:
    description: AWS IAM role ARN to assume via OIDC
    required: true
  env-name:
    description: CDK envName context value (staging|prod|preview|pr-N)
    required: true
  aws-region:
    description: AWS region
    required: false
    default: eu-west-1
  filter:
    description: pnpm workspace filter for the CDK app
    required: false
    default: infra
  context-key:
    description: CDK context key passed via -c KEY=value
    required: false
    default: envName
runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
    - run: pnpm --filter ${{ inputs.filter }} synth -- -c ${{ inputs.context-key }}=${{ inputs.env-name }}
      shell: bash