name: CDK Diff
description: Configure AWS credentials, run CDK diff, and comment on PRs
inputs:
  role-to-assume:
    description: AWS IAM role ARN to assume via OIDC
    required: true
  env-name:
    description: CDK envName context value (staging|prod|preview|pr-N)
    required: true
  aws-region:
    description: AWS region
    required: false
    default: eu-west-1
outputs:
  comment-id:
    description: ID of the created/updated comment
    value: ${{ steps.comment.outputs.result }}
runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
    - name: Run CDK Diff
      if: ${{ github.event_name != 'pull_request' }}
      run: pnpm --filter infra diff -- -c envName=${{ inputs.env-name }}
      shell: bash
    - name: Run CDK Diff (PR)
      if: ${{ github.event_name == 'pull_request' }}
      run: pnpm --filter infra diff -- -c envName=${{ inputs.env-name }} > cdk-diff.txt || true
      shell: bash
    - name: Comment on PR
      id: comment
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/github-script@v9
      with:
        result-encoding: string
        script: |
          const scriptModule = require('${{ github.action_path }}/script.js');
          return await scriptModule({ github, context });