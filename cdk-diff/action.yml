name: CDK Diff
description: Configure AWS credentials, run CDK diff, and comment on PRs
inputs:
  role-to-assume:
    description: AWS IAM role ARN to assume via OIDC
    required: true
  aws-region:
    description: AWS region
    required: false
    default: eu-west-1
runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
    - name: Run CDK Diff
      if: ${{ github.event_name != 'pull_request' }}
      run: pnpm --filter infra prod:diff
      shell: bash
    - name: Run CDK Diff (PR)
      if: ${{ github.event_name == 'pull_request' }}
      run: pnpm --filter infra prod:diff > cdk-diff.txt || true
      shell: bash
    - name: Comment on PR
      if: ${{ github.event_name == 'pull_request' }}
      run: ${{ github.action_path }}/post-pr-comment.sh
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
