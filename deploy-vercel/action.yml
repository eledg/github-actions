name: Deploy to Vercel
description: Deploy a Vercel project to preview or production
inputs:
  production:
    description: Deploy to production
    required: false
    default: 'false'
  vercel-org-id:
    description: Vercel organisation ID
    required: true
  vercel-project-id:
    description: Vercel project ID
    required: true
  vercel-token:
    description: Vercel token
    required: true
  build-env:
    description: Build-time environment variables for the Vercel build, one KEY=value per line
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: ~/.npm
        key: npm-vercel-cli
    - name: Install Vercel CLI
      run: npm i -g vercel
      shell: bash
    - name: Deploy project artifacts to Vercel
      run: |
        args=()
        while IFS= read -r line; do
          if [ -n "$line" ]; then args+=(--build-env "$line"); fi
        done <<< "$BUILD_ENV"
        vercel $PROD_FLAG --token="$VERCEL_TOKEN" --logs "${args[@]}"
      shell: bash
      env:
        BUILD_ENV: ${{ inputs.build-env }}
        PROD_FLAG: ${{ inputs.production == 'true' && '--prod' || '' }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
