name: Setup pnpm
description: Install Node.js, pnpm, restore the pnpm store cache, and install dependencies
inputs:
  enable-turbo-cache:
    description: Cache the .turbo directory between runs. Set to 'false' for jobs that do not run turbo tasks.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - uses: pnpm/action-setup@v6
      name: Install pnpm
    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
    - uses: actions/cache@v6
      name: Setup pnpm cache
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - uses: actions/cache@v6
      name: Setup turbo cache
      if: inputs.enable-turbo-cache == 'true'
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-
    - run: pnpm install --frozen-lockfile
      shell: bash
