name: Setup pnpm
description: Install Node.js, pnpm, optionally restore the pnpm store cache, and install dependencies
inputs:
  cache-store:
    description: >-
      Restore and save the pnpm store with actions/cache. Set to 'false' when the store is large: unpacking it can
      take longer than installing from the registry, and pnpm doesn't guarantee caching is faster.
    required: false
    default: 'true'
  enable-turbo-cache:
    description: Cache the .turbo directory between runs. Set to 'false' for jobs that do not run turbo tasks.
    required: false
    default: 'false'
  node-version:
    description: Node.js version to install (passed to actions/setup-node).
    required: false
    default: "lts/*"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - uses: pnpm/action-setup@v6
      name: Install pnpm
    - name: Get pnpm store directory
      if: inputs.cache-store == 'true'
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
    - uses: actions/cache@v6
      name: Setup pnpm cache
      if: inputs.cache-store == 'true'
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - uses: actions/cache@v6
      name: Setup turbo cache
      if: inputs.enable-turbo-cache == 'true'
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-
    - run: pnpm install --frozen-lockfile
      shell: bash
