name: Setup pnpm
description: Install Node.js and pnpm, and install dependencies, optionally from a cached pnpm store
inputs:
  cache-store:
    description: >-
      Restore and save the pnpm store with actions/cache. Off by default: on GitHub's runners, restoring the store
      took longer than the few seconds it saved the install, in every repo measured.
    required: false
    default: 'false'
  filter:
    description: >-
      pnpm workspace filter for the install, e.g. a package name, or `<package>...` with its workspace dependencies.
      Empty installs the whole workspace. The install fails if the filter matches no project.
    required: false
    default: ''
  enable-turbo-cache:
    description: Cache the .turbo directory between runs. Set to 'false' for jobs that do not run turbo tasks.
    required: false
    default: 'false'
  node-version:
    description: Node.js version to install (passed to actions/setup-node).
    required: false
    default: "lts/*"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - uses: pnpm/action-setup@v6
      name: Install pnpm
    - name: Get pnpm store directory
      if: inputs.cache-store == 'true'
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
    - uses: actions/cache@v6
      name: Setup pnpm cache
      if: inputs.cache-store == 'true'
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - uses: actions/cache@v6
      name: Setup turbo cache
      if: inputs.enable-turbo-cache == 'true'
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-
    # --fail-if-no-match: without it pnpm exits 0 when the filter matches nothing, installing nothing
    - run: pnpm install --frozen-lockfile ${FILTER:+--filter "$FILTER" --fail-if-no-match}
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
